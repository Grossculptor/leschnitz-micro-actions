name: Scrape & Generate (3h)
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-pipeline
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent hanging workflows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Costs no API calls and takes about a second. If an invariant is broken,
      # stop here rather than discovering it in the published data.
      - name: Invariant selftest
        run: python scripts/selftest.py

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SYSTEM_PROMPT: ${{ secrets.SYSTEM_PROMPT }}
        run: python scripts/pipeline.py
      - name: Commit data & site JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # quarantine.json MUST be committed: the runner is ephemeral, so without it
          # the per-item retry counter resets every run and failed items are retried
          # forever instead of being suppressed after 3 attempts.
          git add data docs/data/projects.json docs/data/wordclouds \
                  docs/data/quarantine.json docs/data/suppressed.json \
                  docs/data/last_run.json
          git commit -m "Auto: scrape + micros @ $(date -u +'%Y-%m-%dT%H:%MZ')" || echo "no changes"
          git push

      # Runs last, after the push, so a red run is the alarm rather than a gate:
      # quarantine state still persists and healthy items still publish, but a
      # broken generator can no longer fail silently for months.
      - name: Data health check
        run: python scripts/check_data_health.py

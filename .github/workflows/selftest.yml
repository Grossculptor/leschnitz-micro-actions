name: Selftest

# Guards the invariants recovered on 2026-07-30: a failed generation must never
# become a published item. Runs offline, no secrets, no API calls.
on:
  push:
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/selftest.yml'
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Invariant selftest
        run: python scripts/selftest.py
      - name: Data health check
        run: python scripts/check_data_health.py
